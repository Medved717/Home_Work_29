{% extends 'catalog/base.html'%}
{% block title %} Регистрация пользователя {% endblock %}
{% block content %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Регистрация пользователя</h1>
    <p class="lead">Skystore - это отличный вариант хранения ваших плагинов и примеров кода, который вы бы хотели
        продать</p>
</div>
<form class="row" method="post" enctype="multipart/form-data">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-6">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <div class="card">
                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Зарегистрировать</button>
                        <a href="{% url 'catalog:product_list'%}" class="btn btn-lg btn-outline-primary">Назад</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

{% endblock %}
