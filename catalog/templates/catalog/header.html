<header>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
        <nav class="ms-5">
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_list' %}">Каталог</a>
            <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_create' %}">Создать продукт</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:category_create' %}">Создать категорию</a>
            {% if user.is_authenticated %}
            <form method='post' action="{% url 'users:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type='submit' class="p-2 btn btn-outline-primary">Выход</button>
            </form>
            {% else %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:register_users' %}">Зарегистрироваться</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
            {% endif %}
        </nav>
    </div>
</header>
