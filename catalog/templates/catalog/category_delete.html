{% extends 'catalog/base.html' %}
{% block title %}Удаление категории{% endblock %}
{% include 'catalog/headers.html' %}
{% block content %}

<div class="container">

    <div class="row justify-content-center">
        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="mb-4">Удаление категории</h1>
                    <p>Вы действительно хотите удалить "{{category.name}}"?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Удалить</button>
                        <a href="{% url 'catalog:product_list' %}" class="btn btn-primary">Отменить</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
